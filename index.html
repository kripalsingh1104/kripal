<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You Bubu ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Quicksand:wght@300;400;500&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose:  #c8445a;
    --blush: #f2b8c6;
    --deep:  #1a0a12;
    --cream: #fdf0f4;
    --glow:  #ff7fa3;
  }

  body {
    background: var(--deep);
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    overflow-x: hidden;
    cursor: default;
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .floaters { position: fixed; inset:0; pointer-events:none; z-index:5; }
  .fh {
    position: absolute;
    animation: floatUp linear forwards;
    opacity: 0;
  }
  @keyframes floatUp {
    0%   { opacity:0; transform: translateY(0) scale(.6); }
    15%  { opacity:.8; }
    85%  { opacity:.4; }
    100% { opacity:0; transform: translateY(-100vh) scale(1.1); }
  }

  .page {
    position: relative;
    z-index: 10;
    max-width: 560px;
    margin: 0 auto;
    padding: 2rem 1.2rem 3rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
  }

  /* ── Top card ── */
  .top-card {
    width: 100%;
    background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border: 1px solid rgba(200,68,90,.25);
    border-radius: 2.2rem;
    padding: 2rem 1.8rem 1.5rem;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 60px rgba(200,68,90,.15);
    animation: cardIn 1.2s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes cardIn {
    from { opacity:0; transform: translateY(36px) scale(.94); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  .heart {
    display: inline-block;
    font-size: clamp(3rem, 9vw, 4.5rem);
    animation: heartbeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 14px var(--rose));
    margin-bottom: .6rem;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14%     { transform: scale(1.28); }
    28%     { transform: scale(1.1); }
    42%     { transform: scale(1.24); }
  }

  .headline {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 300;
    font-style: italic;
    color: var(--cream);
    line-height: 1.05;
    margin-bottom: .3rem;
  }
  .headline em { font-style: normal; color: var(--glow); text-shadow: 0 0 22px rgba(255,127,163,.5); }

  .bubu-line {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 300;
    font-style: italic;
    color: var(--blush);
    margin-bottom: .3rem;
  }

  .sub {
    font-size: .72rem;
    color: rgba(242,184,198,.55);
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  /* ── Bubu Dudu image strip ── */
  .img-strip {
    width: 100%;
    display: flex;
    gap: .8rem;
    justify-content: center;
    animation: cardIn 1.2s .2s cubic-bezier(.22,1,.36,1) both;
  }

  .img-frame {
    flex: 1;
    max-width: 160px;
    border-radius: 1.4rem;
    overflow: hidden;
    border: 1px solid rgba(200,68,90,.3);
    box-shadow: 0 0 28px rgba(200,68,90,.12);
    position: relative;
    aspect-ratio: 1/1;
    background: rgba(255,255,255,.04);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: .3rem;
  }

  .img-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .img-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(26,10,18,.85));
    padding: .5rem .5rem .5rem;
    text-align: center;
    font-size: .7rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--blush);
  }

  /* placeholder emoji when no image */
  .img-placeholder { font-size: 3.5rem; }

  /* ── Tap messages ── */
  .msg-section {
    width: 100%;
    animation: cardIn 1.2s .35s cubic-bezier(.22,1,.36,1) both;
  }

  .tap-hint {
    text-align: center;
    font-size: .72rem;
    color: rgba(242,184,198,.5);
    letter-spacing: .14em;
    text-transform: uppercase;
    margin-bottom: .6rem;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  .bubble {
    background: linear-gradient(135deg, rgba(200,68,90,.16), rgba(107,26,46,.2));
    border: 1px solid rgba(200,68,90,.28);
    border-radius: 18px 18px 18px 4px;
    padding: .85rem 1.2rem;
    margin-bottom: .55rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 54px;
    transition: transform .12s, box-shadow .2s;
    position: relative;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(6px);
  }
  .bubble:hover { box-shadow: 0 0 20px rgba(255,127,163,.2); }
  .bubble:active { transform: scale(.97); }

  .b-icon {
    font-size: 1.4rem;
    opacity: .45;
    position: absolute;
    transition: opacity .3s;
  }
  .b-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.08rem;
    font-weight: 300;
    color: rgba(253,240,244,.88);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .45s, transform .45s;
    text-align: center;
    line-height: 1.55;
    pointer-events: none;
  }
  .bubble.open .b-icon { opacity: 0; }
  .bubble.open .b-text { opacity: 1; transform: translateY(0); }

  .dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin: .6rem 0 0;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(200,68,90,.25);
    transition: background .4s, transform .3s;
  }
  .dot.done { background: var(--rose); transform: scale(1.2); }

  /* ── Final overlay ── */
  .final {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(26,10,18,.95);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: .8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity .8s;
    text-align: center;
    padding: 2rem;
  }
  .final.show { opacity: 1; pointer-events: all; }

  .final-emoji { font-size: 3.5rem; animation: heartbeat 1.4s ease-in-out infinite; }

  .final-big {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.2rem, 8vw, 4rem);
    font-style: italic;
    font-weight: 300;
    color: var(--glow);
    text-shadow: 0 0 36px rgba(255,127,163,.55);
    line-height: 1.1;
  }

  .final-names {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.2rem, 4vw, 1.6rem);
    font-style: italic;
    color: var(--blush);
    opacity: .8;
  }

  .final-sub {
    font-size: .75rem;
    color: rgba(242,184,198,.5);
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .restart-btn {
    margin-top: 1rem;
    background: transparent;
    border: 1px solid rgba(200,68,90,.45);
    color: var(--blush);
    font-family: 'Quicksand', sans-serif;
    font-size: .75rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    padding: .55rem 1.5rem;
    border-radius: 2rem;
    cursor: pointer;
    transition: background .25s;
  }
  .restart-btn:hover { background: rgba(200,68,90,.15); }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div class="floaters" id="floaters"></div>

<div class="page">

  <!-- Top card -->
  <div class="top-card">
    <div class="heart">❤️</div>
    <h1 class="headline">I <em>Love</em> You</h1>
    <p class="bubu-line">my Bubu 🐻</p>
    <p class="sub">always &amp; forever, your Dudu 🐥</p>
  </div>

  <!-- Bubu Dudu image strip -->
  <div class="img-strip">
    <div class="img-frame">
      <img src="https://i.pinimg.com/736x/2e/6e/92/2e6e92f2e9c8c5e6a1b3e5c7e6f2a1b3.jpg"
           onerror="this.style.display='none';this.parentNode.querySelector('.img-placeholder').style.display='block'"
           alt="Bubu">
      <span class="img-placeholder" style="display:none">🐻</span>
      <div class="img-label">Bubu 🐻</div>
    </div>
    <div class="img-frame">
      <img src="https://i.pinimg.com/736x/2e/6e/92/2e6e92f2e9c8c5e6a1b3e5c7e6f2a1b3.jpg"
           onerror="this.style.display='none';this.parentNode.querySelector('.img-placeholder').style.display='block'"
           alt="Dudu">
      <span class="img-placeholder" style="display:none">🐥</span>
      <div class="img-label">Dudu 🐥</div>
    </div>
    <div class="img-frame">
      <img src="https://i.pinimg.com/736x/2e/6e/92/2e6e92f2e9c8c5e6a1b3e5c7e6f2a1b3.jpg"
           onerror="this.style.display='none';this.parentNode.querySelector('.img-placeholder').style.display='block'"
           alt="Bubu & Dudu">
      <span class="img-placeholder" style="display:none">🐻🐥</span>
      <div class="img-label">Us 💕</div>
    </div>
  </div>

  <!-- Tap messages -->
  <div class="msg-section">
    <p class="tap-hint">💬 tap to open each message</p>
    <div id="bubbles"></div>
    <div class="dots" id="dots"></div>
  </div>

</div>

<!-- Final overlay -->
<div class="final" id="finalMsg">
  <div class="final-emoji">💖</div>
  <div class="final-big">You are my everything, Bubu</div>
  <div class="final-names">🐻 Bubu &amp; Dudu 🐥</div>
  <div class="final-sub">forever &amp; always, with every heartbeat</div>
  <button class="restart-btn" onclick="restart()">↩ read again</button>
</div>

<script>
const MSGS = [
  "Bubu, you make every ordinary day feel magical ✨",
  "Your smile is my favourite thing in the whole world 🌸",
  "I fall for you a little more every single day 💫",
  "You are my safe place, my peace, my home 🏡",
  "I love you so much Bubu — more than words can say ❤️",
  "With you, forever would never be enough 🌹",
  "You are the best thing that ever happened to me 🐻🐥",
];

const bCont   = document.getElementById('bubbles');
const dotCont = document.getElementById('dots');
const finalEl = document.getElementById('finalMsg');
let revealed  = 0;

MSGS.forEach((msg, i) => {
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = `<span class="b-icon">💌</span><span class="b-text">${msg}</span>`;
  const open = () => {
    if (b.classList.contains('open')) return;
    b.classList.add('open');
    document.getElementById('dot'+i).classList.add('done');
    burst(b);
    revealed++;
    if (revealed === MSGS.length) setTimeout(() => { finalEl.classList.add('show'); bigBurst(); }, 700);
  };
  b.addEventListener('click', open);
  b.addEventListener('touchstart', e => { e.preventDefault(); open(); }, {passive:false});
  bCont.appendChild(b);

  const d = document.createElement('div');
  d.className = 'dot'; d.id = 'dot'+i;
  dotCont.appendChild(d);
});

function restart() {
  finalEl.classList.remove('show');
  revealed = 0;
  document.querySelectorAll('.bubble').forEach((b,i) => {
    b.classList.remove('open');
    document.getElementById('dot'+i).classList.remove('done');
  });
}

const floaters = document.getElementById('floaters');
const emojis = ['❤️','💗','🌸','💕','💖','🌹','✨','🐻','🐥'];

function burst(el) {
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top  + rect.height/2;
  for (let i=0;i<10;i++){
    const f = document.createElement('span');
    f.className='fh';
    f.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const dx = (Math.random()*80-40).toFixed(0);
    f.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;font-size:${(Math.random()*.8+.8).toFixed(2)}rem;animation-duration:${(Math.random()*1.2+1).toFixed(1)}s;transform:translateX(${dx}px)`;
    floaters.appendChild(f);
    setTimeout(()=>f.remove(),2500);
  }
}

function bigBurst(){
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const f=document.createElement('span');
      f.className='fh';
      f.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      f.style.cssText=`position:absolute;left:${Math.random()*100}vw;bottom:-2rem;font-size:${(Math.random()*1.5+1).toFixed(2)}rem;animation-duration:${(Math.random()*4+4).toFixed(1)}s`;
      floaters.appendChild(f);
      setTimeout(()=>f.remove(),9000);
    }, i*80);
  }
}

/* Starfield */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,stars=[];
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize',resize);
for(let i=0;i<140;i++) stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,a:Math.random(),da:(Math.random()*.007+.002)*(Math.random()<.5?1:-1)});
function drawCanvas(){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    s.a+=s.da; if(s.a<=0||s.a>=1) s.da*=-1;
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,127,163,${s.a*.65})`; ctx.fill();
  }
  requestAnimationFrame(drawCanvas);
}
drawCanvas();

/* Ambient floaters */
function spawnHeart(){
  const f=document.createElement('span');
  f.className='fh';
  f.textContent=emojis[Math.floor(Math.random()*emojis.length)];
  f.style.cssText=`position:absolute;left:${Math.random()*100}vw;bottom:-2rem;font-size:${(Math.random()*1+.6).toFixed(2)}rem;animation-duration:${(Math.random()*8+8).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s`;
  floaters.appendChild(f);
  setTimeout(()=>f.remove(),14000);
}
setInterval(spawnHeart,900);
for(let i=0;i<6;i++) setTimeout(spawnHeart,i*400);
</script>
</body>
</html>
